name: Import official LEOGO logo

on:
  push:
    paths:
      - '.github/workflows/import-official-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact V1 LEOGO logo
        run: |
          python - <<'PY'
          import base64, pathlib, re, urllib.request
          url='https://raw.githubusercontent.com/vincentozzomondi1997-cloud/leogo-digital-market/main/index.html'
          text=urllib.request.urlopen(url).read().decode('utf-8')
          m=re.search(r'const LOGO_DATA = "data:image/jpeg;base64,([A-Za-z0-9+/=]+)";', text)
          if not m:
              raise SystemExit('Official V1 LOGO_DATA not found')
          out=pathlib.Path('assets/images/leogo-official-logo.jpg')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(base64.b64decode(m.group(1)))
          print('Imported', out, out.stat().st_size, 'bytes')
          PY
      - name: Commit official logo asset
        run: |
          git config user.name 'LEOGO V2 Build Bot'
          git config user.email 'leogodigitalmarket2@gmail.com'
          git add assets/images/leogo-official-logo.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'Phase 1A: add exact official LEOGO logo asset'
          git push
